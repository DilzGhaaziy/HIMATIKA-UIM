<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050E1F">
<title>Departemen Agama - HIMATIKA</title>
<link rel="icon" href="https://i.ibb.co/MkNRxfFG/Proyek-Baru-288-F09-EFA8.png">
<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;})();</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
.spirit{display:grid;grid-template-columns:1.4fr 1fr;gap:1.2rem;margin-top:2rem}
.doa{position:relative;background:linear-gradient(150deg,var(--navy-800),var(--navy-950));color:#fff;border-radius:28px;padding:clamp(1.6rem,4vw,2.8rem);overflow:hidden;text-align:center;min-height:380px;display:flex;flex-direction:column;justify-content:center}
.doa::before{content:'';position:absolute;inset:0;opacity:.07;background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0);background-size:22px 22px}
.doa>*{position:relative}
.doa h3{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);margin-bottom:1.4rem}
.arab{font-family:'Amiri',serif;font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:2;direction:rtl;margin-bottom:1.2rem}
.latin{color:rgba(255,255,255,.6);font-style:italic;font-size:.9rem;margin-bottom:.9rem}
.arti{font-weight:500;color:rgba(255,255,255,.9)}
.src{margin-top:1.2rem;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.side{display:flex;flex-direction:column;gap:1.2rem}
.quote-card{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:2rem;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center}
.quote-card>i{font-size:1.6rem;color:var(--mint);margin-bottom:1rem}
.quote-card p{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;line-height:1.5}
.quote-card small{display:block;margin-top:1rem;font-weight:800;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2)}
.timer{display:flex;align-items:center;gap:1rem;padding:1.1rem 1.4rem;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:.82rem;font-weight:600;color:var(--text-2)}
.bar{flex:1;height:5px;border-radius:5px;background:var(--bg-2);overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));transform-origin:0 50%;animation:fill 30s linear infinite}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fade{animation:fadeUp .7s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:960px){.spirit{grid-template-columns:1fr}}
</style>
</head>
<body data-page="agama">
<main id="dept"></main>
<script src="app.js"></script>
<script>
HIMA.renderDept({
  key: 'agama',
  desc: 'Departemen Agama adalah bidang yang bertanggung jawab dalam membina karakter spiritual dan religiusitas mahasiswa Informatika. Departemen ini berfokus pada kegiatan kerohanian, penyediaan ruang diskusi keagamaan, serta penguatan nilai-nilai moral dan etika yang menjadi fondasi dalam berorganisasi dan bermasyarakat.',
  leaders: [ { name:'Rahma Aulya', role:'Ketua Departemen' }, { name:'Lucky Cahya Khalima Usada', role:'Wakil Ketua Departemen' } ],
  units: [],
  noUnitText: 'Departemen ini tidak memiliki unit.'
});

document.getElementById('deptExtra').innerHTML = `
  <div class="section-head reveal" style="margin-top:3.5rem"><div><span class="eyebrow">Pengingat Harian</span><h2 class="title">Doa &amp; <span class="hl">Mutiara Hikmah</span></h2></div></div>
  <div class="spirit">
    <div class="doa reveal" id="doa"></div>
    <div class="side">
      <div class="quote-card reveal" id="quote"></div>
      <div class="timer reveal"><i class="fa-solid fa-rotate"></i> Berganti otomatis tiap 30 detik <div class="bar"><span></span></div></div>
    </div>
  </div>`;
HIMA.observe();

const prayers = [
  { title:"Doa Memohon Ilmu, Rezeki, dan Amal yang Diterima", arab:"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا", latin:"Allahumma inni as-aluka 'ilman nafi'an, wa rizqan thayyiban, wa 'amalan mutaqabbalan", meaning:"Ya Allah, sungguh aku memohon kepada-Mu ilmu yang bermanfaat, rezeki yang baik, dan amal yang diterima.", source:"HR. Ibnu Majah (no. 925) & Ahmad" },
  { title:"Doa Masuk & Keluar WC", arab:"Masuk: اللَّهُمَّ إنِّي أَعُوذُ بِك من الْخُبْثِ وَالْخَبَائِثِ <br>Keluar: غُفْرَانَكَ الْحَمْدُ للهِ الَّذِىْ اَذْهَبَ عَنّى اْلاَذَى وَعَافَانِىْ", latin:"Masuk: Bismillahi, Allahumma inni a'udzu bika minal khubutsi wal khabaitsi<br>Keluar: Ghufrānaka, alhamdulillāhil-ladzī adzhaba 'annī al-adzā wa 'āfānī", meaning:"Masuk: Ya Allah, sungguh aku berlindung kepada-Mu dari godaan setan laki-laki dan setan perempuan.<br>Keluar: Dengan mengharap ampunan-Mu, segala puji bagi Allah yang telah menghilangkan kotoran dari badanku dan menyihatkan.", source:"HR. Bukhari & Muslim" },
  { title:"Doa Masuk & Keluar Masjid", arab:"Masuk: اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ <br>Keluar: اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", latin:"Masuk: Allahummaf-tahlii abwaaba rahmatik<br>Keluar: Allahumma inni as-aluka min fadhlik", meaning:"Masuk: Ya Allah, bukakanlah pintu-pintu rahmat-Mu.<br>Keluar: Ya Allah, aku memohon karunia-Mu.", source:"HR. Muslim" },
  { title:"Doa Sebelum Tidur & Bangun Tidur", arab:"Tidur: بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا <br>Bangun: الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", latin:"Tidur: Bismika Allahumma amutu wa ahya<br>Bangun: Alhamdu lillahil ladzii ahyaanaa ba'da maa amaatanaa wa ilaihin nusyuur", meaning:"Tidur: Dengan nama-Mu Ya Allah, aku mati dan aku hidup.<br>Bangun: Segala puji bagi Allah yang telah menghidupkan kami setelah mematikan kami, dan hanya kepada-Nya kami kembali.", source:"HR. Bukhari & Muslim" },
  { title:"Doa Naik Kendaraan", arab:"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ", latin:"Subhaanal ladzii sakhkhara lanaa haadzaa wa maa kunnaa lahu muqriniin, wa innaa ilaa rabbinaa lamunqalibuun", meaning:"Maha Suci Allah yang telah menundukkan semua ini bagi kami padahal kami sebelumnya tidak mampu menguasainya, dan sesungguhnya kami akan kembali kepada Tuhan kami.", source:"QS. Az-Zukhruf: 13-14" }
];
const quotes = [
  { text:"Barangsiapa yang menempuh jalan untuk mencari ilmu, maka Allah akan memudahkan baginya jalan menuju surga.", source:"HR. Muslim" },
  { text:"Sesungguhnya setiap amalan itu bergantung pada niatnya.", source:"HR. Bukhari & Muslim" },
  { text:"Senyummu di hadapan saudaramu adalah sedekah.", source:"HR. Tirmidzi" },
  { text:"Beribadahlah kepada Allah seakan-akan kamu melihat-Nya, jika kamu tidak melihat-Nya, sesungguhnya Dia melihatmu.", source:"HR. Muslim" },
  { text:"Malu itu bagian dari iman.", source:"HR. Bukhari & Muslim" },
  { text:"Mukmin yang paling sempurna imannya adalah yang paling baik akhlaknya.", source:"HR. Tirmidzi" },
  { text:"Sebaik-baik manusia adalah yang paling bermanfaat bagi manusia lainnya.", source:"HR. Ahmad" },
  { text:"Cukuplah kematian sebagai penasihat.", source:"Ath-Thabrani" },
  { text:"Dunia adalah penjara bagi orang mukmin dan surga bagi orang kafir.", source:"HR. Muslim" },
  { text:"Tidak akan masuk surga orang yang di dalam hatinya terdapat sebesar biji sawi kesombongan.", source:"HR. Muslim" },
  { text:"Waktu itu seperti pedang, jika kamu tidak memotongnya, ia akan memotongmu.", source:"Imam Syafi'i" },
  { text:"Tangan di atas lebih baik daripada tangan di bawah.", source:"HR. Bukhari" },
  { text:"Bertakwalah kepada Allah di mana pun kamu berada.", source:"HR. Tirmidzi" },
  { text:"Barangsiapa beriman kepada Allah dan hari akhir, hendaklah ia berkata baik atau diam.", source:"HR. Bukhari" },
  { text:"Barangsiapa yang menutupi aib seorang muslim, Allah akan menutupi aibnya di dunia dan akhirat.", source:"HR. Muslim" },
  { text:"Surga itu di bawah telapak kaki ibu.", source:"HR. Ahmad" },
  { text:"Sampaikanlah dariku walau hanya satu ayat.", source:"HR. Bukhari" },
  { text:"Pekerjaan yang paling dicintai Allah adalah amalan yang dilakukan secara istiqomah meskipun sedikit.", source:"HR. Bukhari" },
  { text:"Dan Dialah yang bersamamu di mana saja kamu berada.", source:"QS. Al-Hadid: 4" },
  { text:"Maka sesungguhnya bersama kesulitan itu ada kemudahan.", source:"QS. Al-Inshirah: 5" }
];
let lastD = -1, lastQ = -1;
const pick = (arr, last) => { let i; do { i = Math.floor(Math.random() * arr.length); } while (arr.length > 1 && i === last); return i; };
function updateContent() {
  lastD = pick(prayers, lastD); lastQ = pick(quotes, lastQ);
  const d = prayers[lastD], q = quotes[lastQ];
  const doa = document.getElementById('doa'), qt = document.getElementById('quote');
  doa.innerHTML = `<h3><i class="fa-solid fa-hands-praying"></i> ${d.title}</h3><div class="arab">${d.arab}</div><p class="latin">${d.latin}</p><p class="arti">"${d.meaning}"</p><p class="src">Sumber: ${d.source}</p>`;
  qt.innerHTML = `<i class="fa-solid fa-quote-left"></i><p>"${q.text}"</p><small>— ${q.source}</small>`;
  [doa, qt].forEach(el => { el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); });
}
updateContent();
setInterval(updateContent, 30000);
</script>
</body>
</html>
