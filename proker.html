<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050E1F">
<title>Program Kerja - HIMATIKA</title>
<link rel="icon" href="https://i.ibb.co/MkNRxfFG/Proyek-Baru-288-F09-EFA8.png">
<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;})();</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
#stars{position:absolute;inset:0;width:100%;height:100%}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
.gallery .pk:nth-child(1){grid-column:span 2;grid-row:span 2}
.pk{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/9;cursor:pointer;background:var(--navy-800);box-shadow:var(--shadow);isolation:isolate}
.pk::before{content:'';position:absolute;inset:-2px;z-index:-1;border-radius:inherit;background:conic-gradient(from var(--a,0deg),var(--gold),var(--cyan),var(--navy-600),var(--gold));animation:rot 6s linear infinite;opacity:0;transition:opacity .4s}
.pk:hover::before{opacity:1}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes rot{to{--a:360deg}}
.pk .in{position:absolute;inset:3px;border-radius:19px;overflow:hidden;background:var(--navy-900)}
.pk img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.pk:hover img{transform:scale(1.07)}
.pk .ov{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:1rem;background:linear-gradient(to top,rgba(5,14,31,.85),transparent 55%);color:#fff;opacity:0;transition:opacity .35s}
.pk:hover .ov{opacity:1}
.pk .ov b{font-family:'Space Grotesk',sans-serif}
.pk .ov i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--navy-950)}
.num{position:absolute;top:.8rem;left:.8rem;z-index:2;font-size:.7rem;font-weight:800;padding:.3rem .7rem;border-radius:999px;background:rgba(5,14,31,.7);color:#fff;backdrop-filter:blur(6px)}
@media (max-width:960px){.gallery{grid-template-columns:repeat(2,1fr)}.pk .ov{opacity:1}}
@media (max-width:560px){.gallery{grid-template-columns:1fr;gap:.9rem}.gallery .pk:nth-child(1){grid-column:auto;grid-row:auto}}
</style>
</head>
<body data-page="proker">
<section class="page-hero">
  <div class="hero-bg"><canvas id="stars"></canvas><div class="blob b1"></div><div class="blob b3"></div></div>
  <div class="container">
    <nav class="crumbs reveal"><a href="index.html">Beranda</a><i class="fa-solid fa-chevron-right"></i><span>Program Kerja</span></nav>
    <span class="eyebrow reveal">Galeri</span>
    <h1 class="reveal" style="--d:.05s">Program <span class="grad">Kerja</span></h1>
    <p class="lead reveal" style="--d:.1s">Kumpulan program kerja HIMATIKA UIM. Klik poster untuk memperbesar dan mengunduhnya.</p>
    <div class="hero-chips reveal" style="--d:.15s"><span class="hchip" style="--c:var(--gold)"><i class="fa-solid fa-images"></i> <span id="total">0</span> Poster</span><span class="hchip" style="--c:var(--cyan)"><i class="fa-solid fa-download"></i> Bisa diunduh</span></div>
  </div>
</section>

<section class="section"><div class="container"><div class="gallery" id="gallery"></div></div></section>

<script src="app.js"></script>
<script>
// Tambah/ubah poster di sini
const PROKER = [
  'https://i.ibb.co.com/ccXfb2xG/Proyek-Baru-128-1-F4-E11-D.png',
  'https://i.ibb.co.com/ccXfb2xG/Proyek-Baru-128-1-F4-E11-D.png',
  'https://i.ibb.co.com/XZbxZpcC/Proyek-Baru-128-F787-A9-C.png',
  'https://i.ibb.co.com/ccCgWs0v/Proyek-Baru-128-CD6-CD7-A.png',
  'https://i.ibb.co.com/b5D44vNC/Proyek-Baru-128-A5-B6-FFD.png',
  'https://i.ibb.co.com/XfMTBZHB/Proyek-Baru-128-FBFFE6-B.png',
  'https://i.ibb.co.com/gKK41hk/Proyek-Baru-128-2-ED8778.png'
];
const items = PROKER.map((src, i) => ({ src, title: `Program Kerja ${i + 1}` }));
document.getElementById('total').textContent = items.length;
const g = document.getElementById('gallery');
g.innerHTML = items.map((it, i) => `
  <div class="pk reveal" style="--d:${(i % 4) * .07}s" data-i="${i}">
    <span class="num">#${String(i + 1).padStart(2, '0')}</span>
    <div class="in"><img src="${it.src}" alt="${it.title}" loading="lazy"></div>
    <div class="ov"><b>${it.title}</b><i class="fa-solid fa-expand"></i></div>
  </div>`).join('');
g.querySelectorAll('.pk').forEach(el => el.addEventListener('click', () => HIMA.openLightbox(items, +el.dataset.i, { download: true })));
HIMA.observe();

// Bintang di hero (lebih ringan dari versi lama: hanya di hero & berhenti saat tab tidak aktif)
(function () {
  const c = document.getElementById('stars'), x = c.getContext('2d');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let w, h, s = [];
  const init = () => { w = c.width = c.offsetWidth; h = c.height = c.offsetHeight; s = Array.from({ length: innerWidth < 768 ? 70 : 140 }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.6 + .3, v: Math.random() * .4 + .1, o: Math.random() })); };
  const draw = () => {
    if (!document.hidden) {
      x.clearRect(0, 0, w, h); x.fillStyle = '#fff';
      s.forEach(p => { x.globalAlpha = p.o; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); p.y += p.v; if (p.y > h) { p.y = 0; p.x = Math.random() * w; } });
    }
    requestAnimationFrame(draw);
  };
  addEventListener('resize', init); init(); draw();
})();
</script>
</body>
</html>
