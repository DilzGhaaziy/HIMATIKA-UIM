<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - HIMATIKA UIM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Background futuristik untuk dashboard */
        body {
            background: linear-gradient(135deg, #001436, #1B427B, #001D4D);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Efek Hover Glass Sidebar */
        .sidebar-icon {
            transition: all 0.3s ease;
        }
        .sidebar-icon:hover, .sidebar-icon.active {
            background: rgba(255, 255, 255, 0.2);
            border-left: 4px solid #fff;
        }
    </style>
</head>
<body class="flex">

    <aside class="glass-panel w-20 md:w-64 h-screen fixed left-0 top-0 flex flex-col justify-between py-6 z-20">
        <div>
            <div class="px-6 mb-10 text-center md:text-left hidden md:block">
                <h1 class="font-heading font-bold text-xl text-white tracking-widest">ADMIN PANEL</h1>
            </div>
            <nav class="flex flex-col space-y-2">
                <button id="navProfil" class="sidebar-icon active flex items-center py-4 px-6 text-white cursor-pointer w-full text-left focus:outline-none">
                    <i class="fas fa-user-circle text-2xl md:mr-4"></i>
                    <span class="hidden md:inline font-medium">Profil</span>
                </button>
                <button class="sidebar-icon flex items-center py-4 px-6 text-gray-300 cursor-pointer w-full text-left focus:outline-none">
                    <i class="fas fa-server text-2xl md:mr-4"></i>
                    <span class="hidden md:inline font-medium">Server</span>
                </button>
                <button class="sidebar-icon flex items-center py-4 px-6 text-gray-300 cursor-pointer w-full text-left focus:outline-none">
                    <i class="fas fa-cog text-2xl md:mr-4"></i>
                    <span class="hidden md:inline font-medium">Pengaturan</span>
                </button>
                <button class="sidebar-icon flex items-center py-4 px-6 text-gray-300 cursor-pointer w-full text-left focus:outline-none">
                    <i class="fas fa-users text-2xl md:mr-4"></i>
                    <span class="hidden md:inline font-medium">List Admin</span>
                </button>
                <button class="sidebar-icon flex items-center py-4 px-6 text-gray-300 cursor-pointer w-full text-left focus:outline-none">
                    <i class="fas fa-user-plus text-2xl md:mr-4"></i>
                    <span class="hidden md:inline font-medium">Tambah Admin</span>
                </button>
            </nav>
        </div>
        
        <div class="px-2 md:px-6">
            <button onclick="window.location.href='index.html'" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-2 rounded-lg transition shadow-lg flex items-center justify-center">
                <i class="fas fa-sign-out-alt md:mr-2 text-xl"></i>
                <span class="hidden md:inline">Tutup Dashboard</span>
            </button>
        </div>
    </aside>

    <main class="ml-20 md:ml-64 p-8 w-full min-h-screen relative z-10">
        
        <div id="viewProfil" class="max-w-4xl mx-auto mt-10">
            <h2 class="text-3xl font-heading font-bold mb-8 border-b border-gray-500 pb-4 inline-block">Profil Akun</h2>
            
            <div class="glass-panel rounded-2xl p-8 flex flex-col md:flex-row items-center md:items-start gap-10">
                <div class="w-48 h-48 rounded-full border-4 border-white shadow-2xl overflow-hidden flex-shrink-0 bg-gray-800 flex items-center justify-center">
                    <i class="fas fa-user-tie text-8xl text-gray-400"></i>
                </div>
                
                <div class="flex-1 space-y-4">
                    <div>
                        <h3 id="profileName" class="text-4xl font-bold font-heading text-white tracking-wide">Memuat...</h3>
                        <div id="profileLabel" class="inline-block mt-2 bg-gradient-to-r from-yellow-500 to-yellow-600 text-black font-bold px-4 py-1 rounded-full text-sm shadow">
                            Owner / Developer
                        </div>
                    </div>
                    
                    <div class="pt-4 grid grid-cols-1 md:grid-cols-2 gap-6 border-t border-white border-opacity-20">
                        <div>
                            <p class="text-sm text-gray-400 uppercase font-bold tracking-wider mb-1">Username</p>
                            <p id="profileUsername" class="text-xl font-medium">@username</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400 uppercase font-bold tracking-wider mb-1">Nomor WhatsApp</p>
                            <p id="profileWA" class="text-xl font-medium flex items-center"><i class="fab fa-whatsapp text-green-400 mr-2"></i>-</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400 uppercase font-bold tracking-wider mb-1">Tanggal Lahir</p>
                            <p id="profileDOB" class="text-xl font-medium"><i class="fas fa-calendar-alt text-blue-300 mr-2"></i>-</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Cek apakah user sudah login. Jika belum, tendang kembali ke index.html
        if(localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }

        // Ambil data akun dari LocalStorage
        const adminDataRaw = localStorage.getItem('adminData');
        if(adminDataRaw) {
            const adminData = JSON.parse(adminDataRaw);
            
            // Masukkan data ke dalam Profile Card
            document.getElementById('profileName').textContent = adminData.name;
            document.getElementById('profileLabel').textContent = adminData.labels;
            document.getElementById('profileUsername').textContent = "@" + adminData.username;
            document.getElementById('profileWA').innerHTML = `<i class="fab fa-whatsapp text-green-400 mr-2"></i> ${adminData.wa}`;
            document.getElementById('profileDOB').innerHTML = `<i class="fas fa-calendar-alt text-blue-300 mr-2"></i> ${adminData.dob}`;
        }
    </script>

</body>
</html>
