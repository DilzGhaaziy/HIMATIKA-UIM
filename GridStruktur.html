<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050E1F">
<title>Struktur Organisasi - HIMATIKA</title>
<link rel="icon" href="https://i.ibb.co/MkNRxfFG/Proyek-Baru-288-F09-EFA8.png">
<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;})();</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
.tier{display:flex;flex-direction:column;align-items:center;position:relative}
.tier-label{display:inline-flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2);background:var(--surface);border:1px solid var(--line);padding:.45rem 1rem;border-radius:999px;margin-bottom:1.4rem;position:relative;z-index:2}
.tier-label i{color:var(--gold)}
.row{display:flex;justify-content:center;gap:1.4rem;flex-wrap:wrap;width:100%}
.connector{width:2px;height:56px;margin:0 auto;background:linear-gradient(var(--gold),var(--cyan));opacity:.6;position:relative}
.connector::after{content:'';position:absolute;bottom:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.pcard{width:220px;cursor:pointer;text-align:center;border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:.7rem .7rem 1rem;box-shadow:var(--shadow);transition:transform .45s var(--ease),box-shadow .45s,border-color .3s}
.pcard .ph{aspect-ratio:4/5;border-radius:17px;overflow:hidden;background:var(--bg-2)}
.pcard img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.pcard:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.pcard:hover img{transform:scale(1.06)}
.pcard b{display:block;font-family:'Space Grotesk',sans-serif;font-size:1rem;margin-top:.85rem;line-height:1.3}
.pcard small{font-size:.75rem;font-weight:700;color:var(--c)}
.top .pcard{width:250px}
.dept-row .pcard{width:200px}
.pcard a{display:inline-flex;align-items:center;gap:.35rem;margin-top:.55rem;font-size:.75rem;font-weight:700;padding:.4rem .8rem;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);transition:.25s}
.pcard a:hover{background:var(--c);color:#fff}
@media (max-width:960px){
  .dept-row{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}
  .dept-row .pcard{width:auto}
}
@media (max-width:560px){
  .row{gap:.8rem}
  .top .pcard,.mid .pcard{width:calc(50% - .4rem)}
  .pcard{padding:.45rem .45rem .8rem;border-radius:18px}
  .pcard .ph{border-radius:13px}
  .pcard b{font-size:.85rem}
  .connector{height:40px}
}
</style>
</head>
<body data-page="struktur">
<section class="page-hero">
  <div class="hero-bg"><div class="hero-grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="container" style="text-align:center">
    <nav class="crumbs reveal" style="justify-content:center"><a href="index.html">Beranda</a><i class="fa-solid fa-chevron-right"></i><span>Struktur Organisasi</span></nav>
    <span class="eyebrow reveal">Kepengurusan</span>
    <h1 class="reveal" style="--d:.05s">Struktur <span class="grad">Organisasi</span></h1>
    <p class="lead reveal" style="--d:.1s;margin-inline:auto">Susunan pengurus HIMATIKA Universitas Indonesia Mandiri. Klik kartu untuk melihat gambar lebih besar.</p>
  </div>
</section>

<section class="section"><div class="container" id="org"></div></section>

<script src="app.js"></script>
<script>
const ORG = {
  pimpinan: [
    { title:'Ketua',       img:'https://i.ibb.co.com/Kxr4sd4y/Proyek-Baru-69-52-C7895.png' },
    { title:'Wakil Ketua', img:'https://i.ibb.co.com/gbVCQGLq/Proyek-Baru-69-285-CF79.png' }
  ],
  inti: [
    { title:'Sekretaris', img:'https://i.ibb.co.com/fzPRds4b/profil-departemen-card-himatika-Copy-Copy-4-Copy-Copy-62-F7-F1-F.png' },
    { title:'Bendahara',  img:'https://i.ibb.co.com/WvLwHXzv/profil-departemen-card-himatika-Copy-Copy-4-3-F39056.png' }
  ],
  departemen: {
    kominfo:'https://i.ibb.co.com/0LpBMNS/profil-departemen-card-himatika-Copy-Copy-AAF6878.png',
    pora:   'https://i.ibb.co.com/WYCKLhF/profil-departemen-card-himatika-Copy-2-F9-E07-D.png',
    agama:  'https://i.ibb.co.com/GvRvHsgy/profil-departemen-card-himatika-Copy-Copy-Copy-56817-B3.png',
    sdm:    'https://i.ibb.co.com/4RnWxyxC/profil-departemen-card-himatika-Copy-Copy-2-8134-F68.png',
    kesra:  'https://i.ibb.co.com/3mZXnzGh/profil-departemen-card-himatika-Copy-Copy-3-519616-D.png'
  }
};
const { DEPTS, esc } = HIMA;
const all = [];
const card = (title, img, sub, color, link) => {
  all.push({ src: img, title }); const i = all.length - 1;
  return `<div class="pcard reveal tilt" style="--c:${color};--d:${(i % 5) * .06}s" data-i="${i}">
    <div class="ph"><img src="${esc(img)}" alt="${esc(title)}" loading="lazy"></div>
    <b>${title}</b><small>${sub}</small>${link ? `<br><a href="${link}">Lihat anggota <i class="fa-solid fa-arrow-right"></i></a>` : ''}</div>`;
};
document.getElementById('org').innerHTML = `
  <div class="tier top"><span class="tier-label reveal"><i class="fa-solid fa-crown"></i> Pimpinan</span>
    <div class="row">${ORG.pimpinan.map(p => card(p.title, p.img, 'HIMATIKA UIM', '#F5B841')).join('')}</div></div>
  <div class="connector"></div>
  <div class="tier mid"><span class="tier-label reveal"><i class="fa-solid fa-briefcase"></i> Pengurus Inti</span>
    <div class="row">${ORG.inti.map(p => card(p.title, p.img, 'Pengurus Inti', '#38BDF8')).join('')}</div></div>
  <div class="connector"></div>
  <div class="tier"><span class="tier-label reveal"><i class="fa-solid fa-layer-group"></i> Departemen</span>
    <div class="row dept-row">${DEPTS.map(d => card('Departemen<br>' + d.name, ORG.departemen[d.key], '', d.color, d.href)).join('')}</div></div>`;
document.querySelectorAll('.pcard').forEach(el => el.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  HIMA.openLightbox(all.map(x => ({ src: x.src, title: x.title.replace('<br>', ' ') })), +el.dataset.i);
}));
HIMA.observe(); HIMA.tilt();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
