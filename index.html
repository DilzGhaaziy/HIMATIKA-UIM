<div id="maintenanceModal" class="fixed inset-0 bg-[#001436] z-[9999] hidden flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-white/10 p-10 rounded-3xl backdrop-blur-xl border border-white/20 shadow-2xl scale-95 animate-pulse">
        <i class="fas fa-tools text-7xl text-yellow-400 mb-6"></i>
        <h2 class="text-3xl font-bold text-white mb-2">MAAF SERVER SEDANG MAINTENANCE</h2>
        <p class="text-gray-300 mb-8">Kami sedang melakukan perbaikan untuk meningkatkan layanan kami.</p>
        <button id="btnMaintenanceOk" disabled class="bg-blue-600 text-white px-10 py-3 rounded-full font-bold opacity-50 cursor-not-allowed transition-all">
            OKE (2s)
        </button>
    </div>
</div>

<script>
    // Listener Realtime Maintenance
    const maintRef = firebase.database().ref('maintenance_mode');
    maintRef.on('value', (snapshot) => {
        const isMaint = snapshot.val();
        const modal = document.getElementById('maintenanceModal');
        const btn = document.getElementById('btnMaintenanceOk');
        
        if(isMaint) {
            modal.classList.remove('hidden');
            let timer = 2;
            btn.disabled = true;
            const countdown = setInterval(() => {
                timer--;
                btn.innerText = `OKE (${timer}s)`;
                if(timer <= 0) {
                    clearInterval(countdown);
                    btn.disabled = false;
                    btn.innerText = "OKE";
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.onclick = () => modal.classList.add('hidden');
                }
            }, 1000);
        } else {
            modal.classList.add('hidden');
        }
    });
</script>
